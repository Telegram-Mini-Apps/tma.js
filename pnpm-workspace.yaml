packages:
  - "apps/*"
  # The previous major packages are kept in packages-old for reference and excluded from the workspace.
  - "packages/*"

# Since pnpm 11, every package with a build script must be listed explicitly.
allowBuilds:
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - error-kid@3.1.0
