name: Run changeset

on:
  workflow_dispatch:
  push:
    branches:
      - "master"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-changeset:
    name: Run changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Rollup
        run: pnpm run ci:packages:rollup

      - name: Run changeset
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          commit-message: 'chore(packages): version packages'
          pr-title: 'chore(packages): version packages'
